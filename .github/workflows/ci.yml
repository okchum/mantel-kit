name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # go.mod's "go" line is the oldest Go the module builds with, not the
      # one to test and scan with: use the current supported release.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: a new release adds checks and would fail unchanged code.
          version: v2.15.0
      # Unpinned on purpose: the vulnerability database changes daily.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
